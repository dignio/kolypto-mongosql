[tool.poetry]
name = "mongosql"
version = "2.0.15-1"
description = "A JSON query engine with SqlAlchemy as a back-end"
authors = ["Mark Vartanyan <kolypto@gmail.com>"]
repository = 'https://github.com/kolypto/py-mongosql'

[tool.poetry.dependencies]
python = "^3.6"
sqlalchemy = '^1.2, !=1.2.9, < 1.4'
nplus1loader = { git = "https://github.com/dignio/kolypto-nplus1loader.git", tag = "v1.0.2b2", optional = true }

[tool.poetry.dev-dependencies]
nox = "^2020.8.22"
pytest = "^7.0"
pytest-cov = "^2.10.1"
nplus1loader = { git = "https://github.com/dignio/kolypto-nplus1loader.git", tag = "v1.0.2b2" }
j2cli = '^0.3.10'
psycopg2-binary = '^2.8'
exdoc = '^0.1.3'
flask_jsontools = { git = "https://github.com/dignio/kolypto-flask-jsontools.git", tag = "v0.1.8", python = ">=3.12" }
looseversion = '^1.3'

[tool.pytest.ini_options]
testpaths = [
    "tests/",
]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
